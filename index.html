<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Inicio - Juego</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            color: white;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: bounce 2s infinite;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 40px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            font-weight: bold;
        }

        .btn-play {
            background-color: #4CAF50;
            color: white;
        }

        .btn-play:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 16px rgba(76, 175, 80, 0.4);
        }

        .btn-settings {
            background-color: #2196F3;
            color: white;
        }

        .btn-settings:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 16px rgba(33, 150, 243, 0.4);
        }

        .btn-exit {
            background-color: #f44336;
            color: white;
        }

        .btn-exit:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 16px rgba(244, 67, 54, 0.4);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 MI JUEGO</h1>
        <p>¡Bienvenido! Prepárate para la aventura</p>
        <div class="buttons">
            <button class="btn-play" onclick="iniciarJuego()">Jugar</button>
            <button class="btn-settings" onclick="abrirConfiguracion()">Configuración</button>
            <button class="btn-exit" onclick="salir()">Salir</button>
        </div>
    </div>

    <script>
        function iniciarJuego() {
            alert('¡El juego comienza!');
            // window.location.href = 'game.html';
        }

        function abrirConfiguracion() {
            alert('Abriendo configuración...');
        }

        function salir() {
            alert('¡Hasta luego!');
        }
    </script>
</body>
</html>
