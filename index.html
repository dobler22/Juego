<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Inicio - Juego</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Partículas de fondo */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        .container {
            text-align: center;
            color: white;
            z-index: 1;
            background: rgba(255, 255, 255, 0.05);
            padding: 60px 40px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-icon {
            font-size: 6rem;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.5));
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 15px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            background: linear-gradient(45deg, #fff, #f0f0f0, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .subtitle {
            font-size: 1.3rem;
            margin-bottom: 50px;
            opacity: 0.9;
            letter-spacing: 1px;
        }

        .buttons {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            position: relative;
            padding: 18px 50px;
            font-size: 1.2rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        button span {
            position: relative;
            z-index: 1;
        }

        .btn-play {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-play:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(17, 153, 142, 0.5);
        }

        .btn-settings {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-settings:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(79, 172, 254, 0.5);
        }

        .btn-exit {
            background: linear-gradient(135deg, #f857a6 0%, #ff5858 100%);
            color: white;
        }

        .btn-exit:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(248, 87, 166, 0.5);
        }

        button:active {
            transform: translateY(-2px) scale(0.98);
        }

        /* Efecto de brillo en los botones */
        @keyframes glowPlay {
            0%, 100% {
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            }
            50% {
                box-shadow: 0 5px 25px rgba(17, 153, 142, 0.6);
            }
        }

        .btn-play {
            animation: glowPlay 2s infinite;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 2.5rem;
            }

            .game-icon {
                font-size: 4rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            button {
                padding: 15px 35px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Partículas de fondo -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="game-icon">🎮</div>
        <h1>MI JUEGO</h1>
        <p class="subtitle">¡Prepárate para la aventura épica!</p>
        <div class="buttons">
            <button class="btn-play" onclick="iniciarJuego()">
                <span>▶ Jugar</span>
            </button>
            <button class="btn-settings" onclick="abrirConfiguracion()">
                <span>⚙ Configuración</span>
            </button>
            <button class="btn-exit" onclick="salir()">
                <span>✕ Salir</span>
            </button>
        </div>
    </div>

    <script>
        // Crear partículas flotantes
        function crearParticulas() {
            const particlesContainer = document.getElementById('particles');
            const numParticulas = 50;

            for (let i = 0; i < numParticulas; i++) {
                const particula = document.createElement('div');
                particula.className = 'particle';
                particula.style.left = Math.random() * 100 + '%';
                particula.style.animationDelay = Math.random() * 15 + 's';
                particula.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particlesContainer.appendChild(particula);
            }
        }

        crearParticulas();

        function iniciarJuego() {
            // Redireccionar a la página del juego
            window.location.href = 'caminandoindex.html';
        }

        function abrirConfiguracion() {
            alert('⚙️ Configuración - Próximamente disponible');
        }

        function salir() {
            if (confirm('¿Estás seguro de que quieres salir?')) {
                alert('¡Hasta luego! 👋');
                // window.close(); // Esto solo funciona si la ventana fue abierta por JavaScript
            }
        }

        // Efecto de sonido al pasar el mouse (opcional)
        const botones = document.querySelectorAll('button');
        botones.forEach(boton => {
            boton.addEventListener('mouseenter', () => {
                // Aquí podrías agregar un efecto de sonido
            });
        });
    </script>
</body>
</html>
